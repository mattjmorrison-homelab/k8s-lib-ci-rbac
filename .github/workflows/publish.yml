name: Publish

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: k8s-amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "v3.21.4"
      # This repo has its own dedicated Zot registry user
      # (k8s-lib-ci-rbac, scoped to exactly charts/k8s-ci-rbac,
      # read+create+update) and its own Kubernetes auth role
      # (k8s-lib-ci-rbac-publish) rather than sharing with other repos,
      # so a leaked credential here can't be used to push charts on
      # their behalf and vice versa. Migrated 2026-09-24 from the old
      # k8s-lib-ci-rbac/zot-ci-password path (never actually populated,
      # this workflow never successfully published before) to the real,
      # already-provisioned per-consumer credential -- see k8s-zot's
      # serviceConsumers and admin-openbao#34/#46.
      - name: Fetch Zot password from OpenBao
        env:
          VAULT_ADDR: http://k8s-openbao.openbao.svc:8200
        run: |
          JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          LOGIN_PAYLOAD=$(jq -n --arg jwt "$JWT" --arg role k8s-lib-ci-rbac-publish '{jwt: $jwt, role: $role}')
          CLIENT_TOKEN=$(curl -sf -X POST "$VAULT_ADDR/v1/auth/kubernetes/login" -d "$LOGIN_PAYLOAD" \
            | jq -r '.auth.client_token')

          ZOT_PASSWORD=$(curl -sf -H "X-Vault-Token: $CLIENT_TOKEN" "$VAULT_ADDR/v1/kv/data/homelab/service/k8s-zot/k8s-lib-ci-rbac/zot-publish" \
            | jq -r '.data.data.value')

          echo "::add-mask::$ZOT_PASSWORD"
          echo "ZOT_PASSWORD=$ZOT_PASSWORD" >> "$GITHUB_ENV"
      - name: Log in to registry
        run: helm registry login registry.morrisons.site -u k8s-lib-ci-rbac --password-stdin <<< "$ZOT_PASSWORD"
      - name: Package chart
        env:
          SHORT_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${SHORT_SHA:0:7}"
          helm package manifests -d dist --version "0.1.0-$SHORT_SHA"
      - name: Push chart
        run: helm push dist/*.tgz oci://registry.morrisons.site/charts
