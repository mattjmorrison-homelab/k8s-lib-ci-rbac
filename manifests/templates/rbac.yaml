{{- range .Values.ciTargets }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .namespace }}-ci
  namespace: {{ .namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .namespace }}-ci-writer
  namespace: {{ .namespace }}
rules:
  - apiGroups: {{ .apiGroups | toYaml | nindent 6 }}
    resources: ["*"]
    verbs: ["get", "list", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .namespace }}-ci-writer
  namespace: {{ .namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .namespace }}-ci
    namespace: {{ .namespace }}
roleRef:
  kind: Role
  name: {{ .namespace }}-ci-writer
  apiGroup: rbac.authorization.k8s.io
---
# Narrow, separate from the writer Role above: only lets the *shared*
# runner identity (github-runner-workload, used by every repo's CI) mint
# a short-lived token for this one namespace's CI ServiceAccount --
# nothing else. The runner identity itself never gains direct write
# access; only the per-namespace {{ .namespace }}-ci identity does, and
# only for as long as a freshly minted token lasts.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .namespace }}-ci-token-issuer
  namespace: {{ .namespace }}
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
    resourceNames: ["{{ .namespace }}-ci"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .namespace }}-ci-token-issuer
  namespace: {{ .namespace }}
subjects:
  - kind: ServiceAccount
    name: github-runner-workload
    namespace: github-runner
roleRef:
  kind: Role
  name: {{ .namespace }}-ci-token-issuer
  apiGroup: rbac.authorization.k8s.io
{{- end }}
